temporary_downloadable_media.settings:
  type: config_object
  label: 'Temporary Downloadable Media Settings'
  mapping:
    user_select:
      type: string
      label: 'select user to generate a valid token'
    token_expired_duration:
      type: string
      label: 'Hours a request-access link stays valid'
    webform_id:
      type: string
      label: 'Webform whose submissions grant access (default: request_access)'
